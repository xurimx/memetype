# Release build: signed foss APK (GitHub / F-Droid) and the play .aab (uploaded to Play Console
# by hand). Manual trigger only for now: run it from the Actions tab. Leave `tag` empty to get the
# files as run artifacts only; give it a tag (e.g. v0.4) to also create a GitHub Release.
#
# Signing is optional: without the four secrets below the APK is built unsigned (not installable,
# useful to check the pipeline). Secrets: UPLOAD_KEYSTORE_B64 (base64 of the upload .jks),
# UPLOAD_STORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v0.4 (empty = artifacts only, no release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4.0.1

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Restore signing key
        if: env.KEYSTORE_B64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK and bundle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleFossRelease :app:bundlePlayRelease

      - name: Collect outputs
        id: collect
        run: |
          VERSION="${{ inputs.tag }}"
          if [ -z "$VERSION" ]; then VERSION="$(git rev-parse --short HEAD)"; fi
          mkdir -p dist
          APK="$(ls app/build/outputs/apk/foss/release/*.apk | head -n 1)"
          cp "$APK" "dist/memetype-${VERSION}-foss.apk"
          cp app/build/outputs/bundle/playRelease/*.aab "dist/memetype-${VERSION}-play.aab"
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          if [ -n "$KEYSTORE_B64" ]; then echo "signed=yes" >> "$GITHUB_OUTPUT"; else echo "signed=no" >> "$GITHUB_OUTPUT"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Remove signing material
        if: always()
        run: rm -f upload.jks keystore.properties

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: memetype-${{ steps.collect.outputs.version }}
          path: dist/*

      - name: Create GitHub release
        if: inputs.tag != ''
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          name: Memetype ${{ inputs.tag }}
          generate_release_notes: true
          body: |
            FOSS build of Memetype (bundled templates, donate link). The Google Play build is a separate listing.
            ${{ steps.collect.outputs.signed == 'no' && '**Unsigned build** — for pipeline testing only; it cannot be installed.' || 'Signed with the Memetype upload key; verify with the SHA-256 sums below.' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
